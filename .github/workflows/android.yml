name: Android APK (debug)

on:
  push:
    branches: [main, feature/initial-android-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Assemble + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Import initial source archive once
        if: ${{ github.event_name == 'push' && github.ref_name == 'feature/initial-android-build' }}
        shell: bash
        run: |
          if [[ ! -f app/build.gradle.kts && -f bootstrap/v0.1.0-app.tar.xz ]]; then
            tar -xJf bootstrap/v0.1.0-app.tar.xz
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .gitignore app build.gradle.kts gradle.properties settings.gradle.kts tools
            git commit -m "Import VAG Diagnostic Android source v0.1.0"
            git push origin HEAD:feature/initial-android-build
          fi

      - name: Require Android project
        run: test -f app/build.gradle.kts && test -f settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1 (archive contains no wrapper)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Upload debuggable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VAG-Diagnostic-v0.1.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
